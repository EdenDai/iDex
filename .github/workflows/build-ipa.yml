name: Build iDex IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Build for iPhone
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild build \
            -project iDex.xcodeproj \
            -scheme iDex \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Package IPA
        run: |
          mkdir -p Payload
          ditto build/Build/Products/Release-iphoneos/iDex.app Payload/iDex.app
          zip -qry iDex-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: iDex-unsigned
          path: iDex-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
